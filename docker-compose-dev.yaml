name: tp0
services:
  server:
    container_name: server
    image: server:latest
    entrypoint: python3 /main.py
    environment:
      # Ensure python output is sent immediately (for logging)
      - PYTHONUNBUFFERED=1
      - CLIENTS=5
    networks:
      - testing_net
    volumes:
      # Mount config.ini from host machine to container
      - ./server/config.ini:/config.ini

  client1:
    container_name: client1
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=1
    networks:
      - testing_net
    depends_on:
      - server
    volumes:
      # Mount config.yaml from host machine to container
      - ./client/config.yaml:/config.yaml
      - ./.data/agency-1.csv:/agency.csv

  client2:
    container_name: client2
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=2
    networks:
      - testing_net
    depends_on:
      - server
    volumes:
      # Mount config.yaml from host machine to container
      - ./client/config.yaml:/config.yaml
      - ./.data/agency-2.csv:/agency.csv

  client3:
    container_name: client3
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=3
    networks:
      - testing_net
    depends_on:
      - server
    volumes:
      # Mount config.yaml from host machine to container
      - ./client/config.yaml:/config.yaml
      - ./.data/agency-3.csv:/agency.csv

  client4:
    container_name: client4
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=4
    networks:
      - testing_net
    depends_on:
      - server
    volumes:
      # Mount config.yaml from host machine to container
      - ./client/config.yaml:/config.yaml
      - ./.data/agency-4.csv:/agency.csv

  client5:
    container_name: client5
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=5
    networks:
      - testing_net
    depends_on:
      - server
    volumes:
      # Mount config.yaml from host machine to container
      - ./client/config.yaml:/config.yaml
      - ./.data/agency-5.csv:/agency.csv

networks:
  testing_net: # Isolated network that allow containers to communicate
    ipam: # IP Address Management settings, used to configure the network
      driver: default # Use default IPAM driver to manage IP addresses
      config:
        - subnet: 172.25.125.0/24
